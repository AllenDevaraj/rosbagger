# rosbagger — workspace ROOT (virtual workspace; intentionally NO [project] table).
# A [project] table here would make uv try to build the root as a package and
# complicate `uv add` (see 01-RESEARCH.md Anti-Patterns). Keep the root virtual:
# only [tool.uv.*] + [dependency-groups] + centralized tooling config.
#
# Lint/format config ([tool.ruff]) and test config ([tool.pytest.ini_options])
# are owned by plan 01-02 (file-ownership split from 01-01).

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# Intra-workspace siblings resolve from the workspace, not PyPI (they are
# unpublished). rosbagger-core is depended on by every other package; record /
# replay are pulled by the rosbagger-gui `[live]` extra (D-02), so both need a
# workspace source here for uv to resolve the extra against the local members.
rosbagger-core = { workspace = true }
rosbagger-record = { workspace = true }
rosbagger-replay = { workspace = true }
# rosbagger-rerun (Phase 22) is pulled by rosbagger-desktop as a regular dep so the
# Replay panel can import it; rerun-sdk stays an OPTIONAL extra (install-on-click).
rosbagger-rerun = { workspace = true }

[dependency-groups]
# matplotlib (>=3.8) is also the `bagq[plot]` extra (packages/bagq/pyproject.toml) — the
# base install stays lean behind that extra, but it lives in the dev group too so CI/tests
# can exercise `bagq query --plot` (06-RESEARCH Installation note; Package Legitimacy: Approved).
dev = [
    "ruff>=0.15,<0.16",
    "pytest>=8,<10",
    "pytest-cov>=6",
    "rosbags>=0.11,<0.12",
    "matplotlib>=3.8",
    # GUI test/dev tooling (slopcheck [OK]): pytest-asyncio drives the headless
    # Textual App tests (Plan 14-07) via asyncio_mode="auto" below; textual-dev
    # ships the `textual` devtools console for interactive panel work.
    "pytest-asyncio>=0.23",
    "textual-dev>=1,<2",
    # Desktop GUI test/dev tooling (Phase 16; slopcheck [OK] — PySide6 = Qt Company,
    # pytest-qt = pytest-dev): pytest-qt's `qtbot` fixture drives the headless PySide6
    # window tests (Plan 16-01) under QT_QPA_PLATFORM=offscreen. PySide6 lives here
    # in the dev group SOLELY so CI can execute those GUI tests — it is NOT added to
    # any package's deps except rosbagger-desktop's (the D-01 isolation invariant).
    "pytest-qt>=4.5,<5",
    "PySide6>=6.10,<6.12",
    # Rerun visualization SDK (Phase 22; slopcheck [OK] — rerun-sdk = Rerun.io, the
    # official viewer SDK, pure-python wheel, NO ROS). In the dev group SOLELY so CI runs
    # the offline rosbagger-rerun converter tests; it is NOT a base dep of any package
    # (rosbagger-rerun declares it under the [sdk] extra — install-on-click at the desktop).
    "rerun-sdk>=0.31,<0.33",
]

# --- Lint + format (ruff): one tool for lint, isort, and format ---
# `src` includes tools and tests so ruff also lints the fixture generator
# (plan 01-03) and the test suite, not just the packages. The Phase-12 live
# member (rosbagger-record/src) is included too so `ruff check .` lints it and
# resolves it as first-party for import sorting.
[tool.ruff]
line-length = 100
src = [
    "packages/rosbagger-core/src",
    "packages/bagq/src",
    "packages/rosbagger-record/src",
    "packages/rosbagger-replay/src",
    "packages/rosbagger-gui/src",
    "packages/rosbagger-desktop/src",
    "packages/rosbagger-rerun/src",
    "tools",
    "tests",
]

[tool.ruff.lint]
# E/pycodestyle, F/pyflakes, I/isort, UP/pyupgrade, B/bugbear, SIM/simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

# --- Tests + coverage (pytest + pytest-cov): >=80% gate enforced here ---
# CI runs `uv run pytest` with no extra flags; the coverage gate lives in
# addopts so local and CI runs are identical.
[tool.pytest.ini_options]
addopts = "--cov=rosbagger_core --cov=bagq --cov=rosbagger_desktop --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
# pytest-asyncio in auto mode: the headless Textual App tests (Plan 14-07) are
# `async def` and run via App.run_test() without per-test @pytest.mark.asyncio
# markers. The Textual TUI (rosbagger-gui) stays OUT of the coverage gate (mirror
# Phase 13 D-12; the TUI is near-zero pure logic by the thin-face rule).
asyncio_mode = "auto"
# pytest-qt binding selection (Phase 16): the headless PySide6 desktop-GUI tests
# (tests/test_desktop.py) run under qtbot with PySide6. The offscreen platform
# (QT_QPA_PLATFORM=offscreen) is set at the top of the desktop test module BEFORE
# any PySide6 import (16-RESEARCH Pitfall 3); qt_api pins the binding so qtbot does
# not try PyQt.
# Phase 17: rosbagger_desktop is now IN the coverage gate above (blended with
# rosbagger_core + bagq under one --cov-fail-under=80). The blend — not a standalone
# desktop floor — is intentional: a handful of desktop paths are irreducibly
# uncoverable offline (cli.py's QApplication.exec main loop; the live-only branches
# in record/replay panels + the scrubber that only run on the `-m live` ROS lane),
# so rosbagger_desktop alone sits ~66%. Folding it into the blended gate brings the
# headlessly-testable code (theme/, widgets/ models, offline panels) under measurement
# and guards against desktop regressions, while not demanding coverage of code that
# physically cannot execute without a real ROS graph or a visible display.
qt_api = "pyside6"
# The `live` marker tags the Phase-12 LIVE integration tests (tests/test_record_live.py,
# Plan 03) that require a sourced ROS 2 environment (rclpy + rosbag2_py). They are
# SKIPPED in the offline CI (gated by importorskip("rclpy")); registering the marker
# here silences pytest's "Unknown pytest.mark.live" warning. The irreducibly-live
# record/replay core can't be covered offline, so it falls outside the blended gate's
# reach (see the rosbagger_desktop note above).
markers = [
    "live: integration tests that require a sourced ROS 2 environment (rclpy + rosbag2_py); skipped in the offline CI",
]
