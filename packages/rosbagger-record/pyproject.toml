# rosbagger-record — the FIRST live (ROS-requiring) module. Discovers active
# ROS 2 topics and records a selected subset to a bag via rosbag2_py.
#
# RUNTIME REQUIREMENT: a sourced ROS 2 environment (e.g.
# `source /opt/ros/humble/setup.bash`). rclpy / rosbag2_py / rosidl_runtime_py
# are ENVIRONMENT-provided by the ROS distro on disk — they are DELIBERATELY
# NOT listed in [project] dependencies so `uv sync` never tries to fetch
# nonexistent PyPI wheels (D-03). They are lazy-imported inside function bodies,
# so this package imports cleanly even in the ROS-free uv venv; the offline
# bagq / inspect / query tools need NO ROS at all.
[project]
name = "rosbagger-record"
version = "0.2.0"
requires-python = ">=3.10"
# rosbagger-core (the v1 reader contract, resolved via the root
# [tool.uv.sources] workspace source) and typer (the thin-CLI face, mirroring
# bagq) are uv-resolved. NOTHING ROS goes here (D-03) — rclpy / rosbag2_py are
# env-provided by the sourced ROS distro, not PyPI wheels.
# 260605-i73: PyYAML is the one ROS-runtime COMPANION we DO declare. The
# env-provided rclpy / rosbag2_py `import yaml` at runtime; unlike them PyYAML IS
# a real PyPI wheel, so D-03's "no nonexistent ROS wheels" rule doesn't apply.
# Declaring it lets a bare `uv run rosbagger-record` — and `rosbagger-desktop`,
# which depends on this package — run live WITHOUT a `--with pyyaml` flag. Pure +
# tiny, so the ROS-free base install (CI included) stays portable.
dependencies = [
    "rosbagger-core>=0.2,<0.3",
    "typer>=0.15,<1",
    "pyyaml>=6,<7",
]

[project.scripts]
# cli.py lands in Plan 03; declaring the entry point now is fine — hatchling
# does not import it at build time.
rosbagger-record = "rosbagger_record.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
