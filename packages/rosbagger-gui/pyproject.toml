# rosbagger-gui — the Textual TUI "cockpit": a thin face over the offline +
# live module APIs (D-12, API-first). It is a uv WORKSPACE MEMBER, mirroring
# rosbagger-replay's manifest shape (swap typer for textual).
#
# OFFLINE-IMPORT INVARIANT (D-03): this package declares NOTHING ROS. Its
# offline panels (inspect/query/tf) drive rosbagger-core only; its live panels
# (record/replay) LAZY-import the already-installed workspace siblings
# (rosbagger-record / rosbagger-replay) inside method bodies in a later wave, so
# `import rosbagger_gui` stays clean in the ROS-free uv venv. The ROS runtime is
# environment-provided by a sourced ROS distro and never resolved by uv here.
[project]
name = "rosbagger-gui"
version = "0.2.0"
requires-python = ">=3.10"
# ONLY rosbagger-core (the v1 reader contract the shared reader uses, resolved
# via the root [tool.uv.sources] workspace source) and textual (the TUI face).
# NOTHING ROS — the live panels lazy-import rosbagger_record / rosbagger_replay
# as already-installed workspace siblings (D-03). The live record/replay deps are
# now an opt-in `[live]` extra (below): a base `uv sync` (or `uv sync --extra
# plot`-style base install) never pulls them, so a ROS-free base sync stays
# ROS-free; only `uv sync --extra live` installs the siblings. They pull the ROS
# runtime at runtime, not at install.
dependencies = ["rosbagger-core>=0.2,<0.3", "textual>=8,<9"]

[project.optional-dependencies]
# Opt-in live tier (D-02): installing `rosbagger-gui[live]` (uv: `--extra live`)
# pulls the live sibling packages so the record/replay panels light up. Purely
# declarative — the panels still lazy-import these inside method bodies, so the
# base import stays rclpy-free.
live = ["rosbagger-record>=0.2,<0.3", "rosbagger-replay>=0.2,<0.3"]

[project.scripts]
# cli.py exposes a plain main() launching RosbaggerApp(bag_path=...).run().
rosbagger-gui = "rosbagger_gui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
