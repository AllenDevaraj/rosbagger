# rosbagger-desktop — the native PySide6 (Qt) desktop "cockpit": a thin face over
# the offline + live module APIs (D-08, API-first), the Qt analog of rosbagger-gui.
# It is a uv WORKSPACE MEMBER, mirroring rosbagger-gui's manifest shape (swap
# textual for PySide6).
#
# ISOLATION INVARIANT (D-01/D-04): PySide6 is declared ONLY here, never in any
# other package and never in the base/offline install graph. Its offline panels
# (inspect/query/tf) drive rosbagger-core only; the live panels (record/replay)
# LAZY-import the already-installed workspace siblings (rosbagger-record /
# rosbagger-replay) inside method/worker bodies in a later wave, so `import
# rosbagger_desktop` stays Qt-free AND ROS-free at top level. The ROS runtime is
# environment-provided by a sourced ROS distro and never resolved by uv here.
[project]
name = "rosbagger-desktop"
version = "0.2.0"
description = "Native PySide6 desktop cockpit for the rosbagger suite — browse, query, replay, and visualize ROS bags."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Allen Devaraj", email = "allendevaraj33333@gmail.com" }]
keywords = ["ros", "ros2", "rosbag", "mcap", "robotics", "gui", "qt", "pyside6", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries",
]
# Sibling pins by SPEC ONLY (no git/path URL baked in — D-02), resolved via the
# root [tool.uv.sources] workspace sources. PySide6 is the ONLY Qt dep and lives
# ONLY here (D-01); RESEARCH Standard Stack pins it to the two current stable
# minors (6.10/6.11) with a guard against an unvetted 6.12.
dependencies = [
    "rosbagger-core>=0.2,<0.3",
    "rosbagger-record>=0.2,<0.3",
    "rosbagger-replay>=0.2,<0.3",
    # Phase 22: the bag→Rerun bridge. Import-safe (pulls NO ROS/rerun at import — both lazy),
    # so the replay panel can lazily `import rosbagger_rerun` for the Open-in-Rerun toggle. The
    # rerun-sdk SDK stays an OPTIONAL extra of rosbagger-rerun (install-on-click), never pulled here.
    "rosbagger-rerun>=0.2,<0.3",
    # Phase 23: pure (ROS/Qt-free) — used by rviz_config.py to emit the generated .rviz YAML for the
    # Open-in-RViz launch. Safe in the offline import graph (pyyaml pulls no ROS/Qt).
    "pyyaml>=6,<7",
    "PySide6>=6.10,<6.12",
]

[project.urls]
Homepage = "https://github.com/AllenDevaraj/rosbagger"
Repository = "https://github.com/AllenDevaraj/rosbagger"
Issues = "https://github.com/AllenDevaraj/rosbagger/issues"

[project.scripts]
# cli.py exposes a plain main() — an argparse front door that constructs
# QApplication only AFTER parse_args, so `rosbagger-desktop --help` exits 0
# WITHOUT building any Qt object (D-16).
rosbagger-desktop = "rosbagger_desktop.cli:main"
# `rosbagger` is the short, friendly alias — SAME entry point — so the desktop
# cockpit opens with one word from any terminal. It is the primary brand command;
# `rosbagger-desktop` stays for the explicit/long name (and is what the ROS launch
# file calls). Both build Qt only after argparse, so `rosbagger --help` is Qt-free.
rosbagger = "rosbagger_desktop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
