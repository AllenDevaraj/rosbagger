# rosbagger-rerun — the bag→Rerun visualization bridge. Converts deserialized ROS 2
# messages into Rerun archetypes and logs them to a RecordingStream, so the desktop
# Replay tab can live-mirror Play into the Rerun viewer (Phase 22).
#
# ISOLATION (mirrors rosbagger-replay's boundary): this package is the ONLY place
# `rerun` is imported, and — like the live ROS packages — every `rerun` / `rclpy` /
# `rosidl_runtime_py` import lives LAZILY inside a function body. So importing
# `rosbagger_rerun` stays ROS-free AND Rerun-free; the offline import graph is
# unaffected (tests/test_offline_guard.py enforces this).
#
# rerun-sdk is DELIBERATELY an OPTIONAL extra (`[sdk]`), never a base dependency:
# the desktop gates the "Open in Rerun" button on `rerun_available()` and installs
# rerun-sdk on-click, so a base install never pulls the (large) viewer SDK.
[project]
name = "rosbagger-rerun"
version = "0.2.0"
description = "Bag-to-Rerun visualization bridge for the rosbagger suite — mirror ROS 2 replay into the Rerun viewer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Allen Devaraj", email = "allendevaraj33333@gmail.com" }]
keywords = ["ros", "ros2", "rosbag", "robotics", "rerun", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries",
]
# numpy is needed by the image converter (frombuffer/reshape); it is import-safe
# (not ROS, not rerun) and already present via matplotlib. rerun-sdk is the OPTIONAL
# extra below — never a base dep (D-03-style: keep base installs lean + ROS/rerun-free).
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/AllenDevaraj/rosbagger"
Repository = "https://github.com/AllenDevaraj/rosbagger"
Issues = "https://github.com/AllenDevaraj/rosbagger/issues"

[project.optional-dependencies]
sdk = ["rerun-sdk>=0.31,<0.33"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
